<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>multi-agent-harness - Visual Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.26.0/cytoscape.min.js"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col font-sans">

  <!-- Header -->
  <header class="bg-gray-800 border-b border-gray-700 px-6 py-4 flex justify-between items-center">
    <div class="flex items-center space-x-3">
      <span class="text-2xl font-bold bg-gradient-to-r from-blue-400 to-indigo-500 bg-clip-text text-transparent">Harness Studio</span>
      <span class="bg-gray-700 text-gray-300 text-xs px-2 py-1 rounded">v0.1.0</span>
    </div>
    <div class="flex items-center space-x-4">
      <div class="flex items-center space-x-2">
        <div id="status-dot" class="w-3 h-3 bg-red-500 rounded-full"></div>
        <span id="status-text" class="text-sm text-gray-400">Disconnected</span>
      </div>
      <button onclick="loadData()" class="bg-indigo-600 hover:bg-indigo-700 text-sm px-4 py-2 rounded font-medium transition">Reload</button>
    </div>
  </header>

  <!-- Main Content -->
  <div class="flex-1 flex overflow-hidden">
    <!-- Left Panel: Graph Visualizer -->
    <div class="w-1/2 border-r border-gray-700 flex flex-col bg-gray-950 relative">
      <div class="absolute top-4 left-4 z-10 bg-gray-800/80 backdrop-blur border border-gray-700 px-3 py-1.5 rounded text-xs text-gray-300">
        Workflow Graph Topology
      </div>
      <div id="cy" class="flex-1 w-full h-full"></div>
    </div>

    <!-- Right Panel: Inspector, Timeline & Diff -->
    <div class="w-1/2 flex flex-col overflow-y-auto p-6 space-y-6">
      
      <!-- Checkpoints Timeline -->
      <section class="bg-gray-800 rounded-lg p-5 border border-gray-700">
        <h3 class="text-lg font-semibold mb-4 text-gray-200">Checkpoint Timeline</h3>
        <div id="timeline" class="flex items-center space-x-4 overflow-x-auto pb-2">
          <!-- Timeline nodes loaded dynamically -->
          <div class="text-gray-500 text-sm italic">No checkpoints recorded yet.</div>
        </div>
      </section>

      <!-- State Inspector -->
      <section class="bg-gray-800 rounded-lg p-5 border border-gray-700 flex-1 flex flex-col">
        <div class="flex justify-between items-center mb-4">
          <h3 class="text-lg font-semibold text-gray-200">State Inspector</h3>
          <div class="space-x-2">
            <button onclick="enableEditing()" id="edit-btn" class="bg-gray-700 hover:bg-gray-600 text-xs px-3 py-1.5 rounded transition">Edit State</button>
            <button onclick="resumeWorkflow()" id="resume-btn" class="bg-indigo-600 hover:bg-indigo-700 text-xs px-3 py-1.5 rounded font-medium transition hidden">Resume from Selected</button>
          </div>
        </div>
        
        <!-- Tab Headers -->
        <div class="flex border-b border-gray-700 mb-4 text-sm">
          <button id="tab-state" class="px-4 py-2 border-b-2 border-indigo-500 font-medium" onclick="switchTab('state')">Current State</button>
          <button id="tab-diff" class="px-4 py-2 border-b-2 border-transparent text-gray-400 hover:text-gray-200 font-medium" onclick="switchTab('diff')">State Diff</button>
        </div>

        <!-- Tab Contents -->
        <div class="flex-1 flex flex-col">
          <textarea id="state-editor" readonly class="w-full flex-1 bg-gray-900 border border-gray-700 rounded p-3 font-mono text-sm text-green-400 focus:outline-none focus:border-indigo-500 resize-none min-h-[300px]"></textarea>
          <pre id="diff-viewer" class="hidden w-full flex-1 bg-gray-900 border border-gray-700 rounded p-3 font-mono text-sm text-gray-300 overflow-auto min-h-[300px]"></pre>
        </div>
      </section>
    </div>
  </div>

  <!-- Realtime Logs Footer -->
  <footer class="h-48 bg-gray-950 border-t border-gray-800 p-4 flex flex-col">
    <div class="text-xs font-semibold text-gray-400 mb-2 uppercase tracking-wider">Real-Time Execution Logs</div>
    <div id="logs" class="flex-1 overflow-y-auto font-mono text-xs text-gray-300 space-y-1 bg-gray-900/50 p-2 rounded border border-gray-800">
      <div class="text-gray-500">Connecting to server real-time logs stream...</div>
    </div>
  </footer>

  <!-- Script logic -->
  <script>
    let cy;
    let checkpoints = [];
    let selectedIndex = -1;
    let isEditing = false;
    let ws;

    // Initialize Cytoscape
    function initGraph(nodes, edges) {
      const cyElements = [];
      nodes.forEach(n => {
        cyElements.push({ data: { id: n.id, label: n.name } });
      });
      edges.forEach(e => {
        cyElements.push({ data: { source: e.source, target: e.target } });
      });

      cy = cytoscape({
        container: document.getElementById('cy'),
        elements: cyElements,
        style: [
          {
            selector: 'node',
            style: {
              'background-color': '#4f46e5',
              'label': 'data(label)',
              'color': '#fff',
              'text-valign': 'center',
              'text-halign': 'center',
              'font-size': '11px',
              'width': '100px',
              'height': '40px',
              'shape': 'round-rectangle'
            }
          },
          {
            selector: 'edge',
            style: {
              'width': 2,
              'line-color': '#4b5563',
              'target-arrow-color': '#4b5563',
              'target-arrow-shape': 'triangle',
              'curve-style': 'bezier'
            }
          }
        ],
        layout: {
          name: 'grid',
          rows: 2
        }
      });
    }

    // Load Data from REST endpoints
    async function loadData() {
      try {
        const graphRes = await fetch('/api/graph');
        const graph = await graphRes.json();
        initGraph(graph.nodes || [], graph.edges || []);

        const threadId = new URLSearchParams(window.location.search).get('threadId') || 'default';
        const checkRes = await fetch(`/api/checkpoints?threadId=${threadId}`);
        checkpoints = await checkRes.json();
        renderTimeline();
      } catch (e) {
        console.error('Failed to load workflow data', e);
      }
    }

    function renderTimeline() {
      const container = document.getElementById('timeline');
      if (checkpoints.length === 0) {
        container.innerHTML = '<div class="text-gray-500 text-sm italic">No checkpoints found.</div>';
        return;
      }

      container.innerHTML = checkpoints.map((c, idx) => {
        const isSelected = idx === selectedIndex;
        const colorClass = isSelected ? 'bg-indigo-600 border-indigo-400' : 'bg-gray-700 border-gray-600 hover:bg-gray-600';
        return `
          <button onclick="selectCheckpoint(${idx})" class="flex-shrink-0 flex flex-col items-center p-3 border rounded transition ${colorClass}">
            <span class="text-xs font-semibold text-gray-200">#${idx + 1}</span>
            <span class="text-[10px] text-gray-400 mt-1">${c.checkpointId.substring(0, 8)}</span>
          </button>
          ${idx < checkpoints.length - 1 ? '<span class="text-gray-600">&rarr;</span>' : ''}
        `;
      }).join('');

      if (selectedIndex === -1) {
        selectCheckpoint(checkpoints.length - 1);
      }
    }

    function selectCheckpoint(idx) {
      selectedIndex = idx;
      renderTimeline();

      const cp = checkpoints[idx];
      const editor = document.getElementById('state-editor');
      editor.value = JSON.stringify(cp.state, null, 2);
      
      // Render diff
      const diffViewer = document.getElementById('diff-viewer');
      if (idx > 0) {
        const prev = checkpoints[idx - 1];
        diffViewer.innerText = getDiffString(prev.state, cp.state);
      } else {
        diffViewer.innerText = 'First checkpoint - no preceding state.';
      }

      // Reset edit state
      isEditing = false;
      editor.readOnly = true;
      document.getElementById('edit-btn').innerText = 'Edit State';
      document.getElementById('resume-btn').classList.add('hidden');
    }

    function getDiffString(obj1, obj2) {
      const keys = new Set([...Object.keys(obj1), ...Object.keys(obj2)]);
      let diff = '';
      keys.forEach(k => {
        const v1 = JSON.stringify(obj1[k]);
        const v2 = JSON.stringify(obj2[k]);
        if (v1 !== v2) {
          diff += `- ${k}: ${v1}\n+ ${k}: ${v2}\n`;
        }
      });
      return diff || 'No differences found.';
    }

    function switchTab(tab) {
      const editor = document.getElementById('state-editor');
      const diff = document.getElementById('diff-viewer');
      const tabState = document.getElementById('tab-state');
      const tabDiff = document.getElementById('tab-diff');

      if (tab === 'state') {
        editor.classList.remove('hidden');
        diff.classList.add('hidden');
        tabState.className = "px-4 py-2 border-b-2 border-indigo-500 font-medium";
        tabDiff.className = "px-4 py-2 border-b-2 border-transparent text-gray-400 hover:text-gray-200 font-medium";
      } else {
        editor.classList.add('hidden');
        diff.classList.remove('hidden');
        tabState.className = "px-4 py-2 border-b-2 border-transparent text-gray-400 hover:text-gray-200 font-medium";
        tabDiff.className = "px-4 py-2 border-b-2 border-indigo-500 font-medium";
      }
    }

    function enableEditing() {
      const editor = document.getElementById('state-editor');
      const editBtn = document.getElementById('edit-btn');
      const resumeBtn = document.getElementById('resume-btn');

      if (!isEditing) {
        isEditing = true;
        editor.readOnly = false;
        editBtn.innerText = 'Cancel Edit';
        resumeBtn.classList.remove('hidden');
      } else {
        isEditing = false;
        editor.readOnly = true;
        editBtn.innerText = 'Edit State';
        resumeBtn.classList.add('hidden');
        selectCheckpoint(selectedIndex);
      }
    }

    async function resumeWorkflow() {
      const cp = checkpoints[selectedIndex];
      const editor = document.getElementById('state-editor');
      let patchedState;
      try {
        patchedState = JSON.parse(editor.value);
      } catch (e) {
        alert('Invalid JSON state!');
        return;
      }

      try {
        const threadId = new URLSearchParams(window.location.search).get('threadId') || 'default';
        const res = await fetch(`/api/checkpoints/${cp.checkpointId}/resume?threadId=${threadId}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ state: patchedState })
        });
        if (res.ok) {
          alert('Workflow resumed successfully!');
          loadData();
        } else {
          alert('Failed to resume workflow.');
        }
      } catch (e) {
        alert('Error resuming: ' + e.message);
      }
    }

    // WebSocket real-time connection
    function connectWS() {
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(`${protocol}//${window.location.host}/api/stream`);
      
      ws.onopen = () => {
        document.getElementById('status-dot').className = 'w-3 h-3 bg-green-500 rounded-full';
        document.getElementById('status-text').innerText = 'Connected';
        document.getElementById('status-text').className = 'text-sm text-green-400';
      };

      ws.onclose = () => {
        document.getElementById('status-dot').className = 'w-3 h-3 bg-red-500 rounded-full';
        document.getElementById('status-text').innerText = 'Disconnected';
        document.getElementById('status-text').className = 'text-sm text-gray-400';
        setTimeout(connectWS, 3000);
      };

      ws.onmessage = (event) => {
        const logDiv = document.getElementById('logs');
        const data = JSON.parse(event.data);
        const line = document.createElement('div');
        line.innerText = `[${new Date(data.timestamp).toLocaleTimeString()}] [${data.type}] ${data.message || JSON.stringify(data)}`;
        logDiv.appendChild(line);
        logDiv.scrollTop = logDiv.scrollHeight;
      };
    }

    // Startup
    loadData();
    connectWS();
  </script>
</body>
</html>
